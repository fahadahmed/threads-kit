name: ThreadsKit · Publish Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
